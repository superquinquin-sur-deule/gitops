---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bizerbator
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: bizerbator-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        media-password: "{{ .MEDIA_PASSWORD }}"
        ftp-users: "odoo|{{ .FTP_PASSWORD }}|/ftp/odoo|10001|10001"
        db-password: "{{ .password }}"
  dataFrom:
    - extract:
        key: outils/bizerbator
    - extract:
        key: pg-main-pguser-bizerbator
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: pg-main-pguser-store
