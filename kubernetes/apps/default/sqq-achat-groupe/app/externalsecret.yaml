---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sqq-achat-groupe
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: sqq-achat-groupe-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # OIDC — same client secret consumed by the KeycloakClient
        # (via $$sqq-achat-groupe-secret)
        QUARKUS_OIDC_AUTH_SERVER_URL: "https://auth.${SECRET_DOMAIN}/realms/surdeule"
        QUARKUS_OIDC_CLIENT_ID: achat-groupe
        QUARKUS_OIDC_CREDENTIALS_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
        # PostgreSQL (Crunchy pg-main user "achatgroupe")
        QUARKUS_DATASOURCE_USERNAME: "{{ .user }}"
        QUARKUS_DATASOURCE_PASSWORD: "{{ .password }}"
        QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://{{ .host }}:{{ .port }}/{{ .dbname }}"
  dataFrom:
    - extract:
        key: default/sqq-achat-groupe
    - extract:
        key: pg-main-pguser-achatgroupe
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: pg-main-pguser-store
