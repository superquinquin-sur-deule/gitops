---
apiVersion: v1.edp.epam.com/v1
kind: KeycloakClient
metadata:
  name: sqq-achat-groupe
spec:
  realmRef:
    name: surdeule
    kind: ClusterKeycloakRealm
  clientId: achat-groupe
  public: false
  directAccess: false
  secret: $$sqq-achat-groupe-secret:OIDC_CLIENT_SECRET
  webUrl: https://precommandes.${SECRET_DOMAIN}
  # Quarkus OIDC is configured with `authentication.redirect-path=/admin/`, so the
  # redirect_uri it sends is always the admin entrypoint.
  redirectUris:
    - https://precommandes.${SECRET_DOMAIN}/admin/*
    - https://precommandes.${SECRET_DOMAIN}/
  webOrigins:
    - https://precommandes.${SECRET_DOMAIN}
